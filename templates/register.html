{% extends "base.html" %}
{% block title %}Register - CommunityBoard{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-9 col-lg-6">
<div class="card shadow-sm"><div class="card-body p-4">
    <h2 class="h4 mb-1">Create your account</h2>
    <p class="text-muted small mb-3">For residents of Barangay Duhat, Santa Cruz, Laguna.</p>
    <form method="POST" class="needs-validation" novalidate>
        {% include "_register_fields.html" %}
        <button type="submit" class="btn btn-cb w-100" data-loading="Creating account...">Register</button>
    </form>
    <p class="mt-3 mb-0 small text-center">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
    <p class="mb-0 small text-center">Barangay official? <a href="{{ url_for('auth.admin_register') }}">Register here</a></p>
</div></div>
</div>
</div>
{% endblock %}
